# Monthly, grouped, at most 3 open PRs: keeps automated PR and CI traffic low.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  groups:
    all:
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  groups:
    all:
      patterns:
      - '*'
